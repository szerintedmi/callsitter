# Cloudflare named tunnel -> 127.0.0.1:8787. Copy to deploy/cloudflared.yml (gitignored) and run
# `bun run tunnel`. This is for dev; production uses deploy/vps/cloudflared.yml (docs/deploy.md).
#   hooks.example.com   public, Telnyx/OpenAI webhooks + media, and the public page
#   admin.example.com   admin UI, behind a Cloudflare Access application (the app also verifies the Access JWT)
# Create with: cloudflared tunnel create callsitter
#              cloudflared tunnel route dns <tunnel-id> <hostname>   (use the ID: a default
#              ~/.cloudflared/config.yml naming another tunnel wins over the name argument)
# Credentials stay outside the repo.
tunnel: <tunnel-id>
credentials-file: /Users/you/.cloudflared/<tunnel-id>.json
# origincert: /Users/you/.cloudflared/cert.pem   # if cert.pem isn't in the default location

ingress:
  # Public: the Telnyx and OpenAI webhooks, media stream, health, and the public page (/, /call…).
  - hostname: hooks.example.com
    path: ^/(telnyx/webhook|openai/webhook|media/.*|healthz|call(/.*)?|play|bot|terms|privacy|listen(/.*)?|favicon\.ico|apple-touch-icon\.png|assets/(public|listen)\.js)?$
    service: http://127.0.0.1:8787
  - hostname: hooks.example.com
    service: http_status:404
  # Admin UI (the whole host; Cloudflare Access in front).
  - hostname: admin.example.com
    service: http://127.0.0.1:8787
  - service: http_status:404

# Optional: pin DNS resolvers if a local resolver (e.g. Tailscale) times out on tunnel DNS.
# dns-resolver-addrs:
#   - 1.1.1.1:53
#   - 1.0.0.1:53
