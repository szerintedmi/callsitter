# Push to main → CI → image to GHCR (by commit SHA) → deploy that exact digest to the VPS over SSH
# through Cloudflare Tunnel + Access (docs/deploy.md). The deploy job is skipped until the
# DEPLOY_SSH_HOST repository variable is set.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      no_cache:
        description: Rebuild every layer (picks up Debian fixes for an unchanged base image)
        type: boolean
        default: false

# One deploy at a time; a newer push waits (the VPS script also takes a lock).
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,format=long
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ inputs.no_cache == true }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_SSH_HOST != ''
    runs-on: ubuntu-latest
    # Covers the VPS script's drain wait (DRAIN_WAIT, default 21 min) plus the switch.
    timeout-minutes: 30
    permissions:
      packages: read # the job's GITHUB_TOKEN lets the VPS pull the image once
    env:
      CLOUDFLARED_VERSION: 2026.10.4
      CLOUDFLARED_SHA256: ae5e8add7884b0531d66bbca4570d1de491ff6da51e4ebe7eb160cdf241d9e42
      SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
      SSH_USER: ${{ vars.DEPLOY_SSH_USER || 'deploy' }}
      IMAGE_REF: ${{ needs.image.outputs.ref }}
    steps:
      - name: Install cloudflared (pinned, checksum verified)
        run: |
          curl -fsSLo cloudflared "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  cloudflared" | sha256sum -c -
          sudo install -m 0755 cloudflared /usr/local/bin/cloudflared
      - name: SSH config (deploy key, pinned host key, Access service token)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 0600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            ServerAliveInterval 30
          EOF
      - name: Deploy ${{ needs.image.outputs.ref }}
        env:
          # read by `cloudflared access ssh` (the ProxyCommand)
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # The deploy key's forced command receives "deploy <ref>"; the token goes on stdin.
          # shellcheck disable=SC2029
          printf '%s' "$REGISTRY_TOKEN" | ssh prod deploy "$IMAGE_REF"
          rc=$?
          set -e
          if [ "$rc" = 75 ]; then
            echo "::warning::Deploy deferred: calls were still active. Nothing changed; re-run this job later."
            echo "Deploy **deferred** (active calls): \`${IMAGE_REF}\`" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$rc" = 0 ]; then
            echo "Deployed \`${GITHUB_SHA}\` as \`${IMAGE_REF}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
