# Prices for each call's cost, shown on the call page, in the logs and in the owner's final
# Telegram update (not billing). Luna and Jev are priced from the tokens they report.
live_usd_per_min: 0.05    # gpt-live-1: "$0.05 per minute, billed per second"
# GPT-6 Luna, per 1M tokens (developers.openai.com/api/docs/models/gpt-6-luna)
luna:
  input_usd_per_mtok: 0.1
  cached_input_usd_per_mtok: 0.01
  cache_write_usd_per_mtok: 0.125
  output_usd_per_mtok: 0.5
  # "Batch and Flex are priced at 50% of Standard rates. Fast mode is priced at 2x"
  tier_multipliers:
    priority: 2
    fast: 2
    flex: 0.5
jev_usd_per_mtok: 0.042   # input tokens; output is free
