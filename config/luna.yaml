# GPT-6 Luna writes for the owner: the rolling summary on the Telegram status message (progress)
# and the end-of-call summary. She sees the call-flow stage, i.e. how the agent was told to
# handle the call. She doesn't steer Live mid-call: call-flow.yaml has no ask_luna rule, and
# Live's own requests for help get a fixed answer (when_live_asks_for_help). To bring her back
# mid-call, add a rule with ask_luna (or {luna_response} in when_live_asks_for_help) and give her
# `instructions` here, plus `reasoning_effort`, `service_tier`, `tools` and `limits` (defaults in
# src/core/config.ts).
model: gpt-6-luna
# End-of-call summary; if Luna steered the call, it continues her conversation, so it sees her
# guidance and tool calls.
# It goes into the call's Telegram status message (telegram.yaml). If the caller said nothing
# after the last rolling summary (progress), that one is reused instead.
summarize_on_hangup: true
summary_instructions: |
  Summarise this phone call for {owner_name} in 2–3 sentences: who called, what they wanted, how
  to reach them (a number they gave, else the one they called from), and whether it was a scam. In the waste time stage the agent
  plays along with a scammer: anything it handed over (card numbers, codes, personal details)
  was made up, so say so; nothing real was shared.
# Rolling update for the owner's Telegram status message (telegram.yaml): who is calling, what
# they want, what they asked that only the owner can answer, steering buttons for the owner
# (telegram.yaml steering.suggestions; a tap sends `text` as a SUPERVISOR line), and whether to
# alert the owner (telegram.yaml status.urgent_alert.luna). Jev decides when it's due: after
# a Jev call whose answer to `when` reaches min (jev.yaml owner_update). Never reaches Live and
# isn't counted in limits.max_calls. Needs Telegram configured.
progress:
  enabled: true
  when: { question: owner_update, answer: new, min: 0.8 }
  # Never more often than this.
  min_interval_ms: 5000
  # Refreshed anyway after this long if the caller has said anything since (null: only on Jev's say).
  max_interval_ms: 30000
  reasoning_effort: low
  instructions: |
    You keep {owner_name} up to date on a phone call that a voice agent is answering as
    {owner_name}. It is speech-to-text, so names and words are often misheard.
    summary: who is calling and what they want, in 1–2 short sentences; say so if it looks like
    a scam or spam. In the waste time stage the agent plays along with a scammer: anything it
    hands over (card numbers, codes, personal details) is made up, so say so; nothing real is
    shared.
    questions: what the caller has asked that only {owner_name} can answer (availability,
    decisions, personal matters), each as a short question; empty if none, or if it's a scam.
    suggestions: at most 3 replies {owner_name} might realistically pick next, shown to them as
    buttons that send `text` to the agent, e.g. label "Call back soon", text "Tell them you'll
    call back as soon as you can." Answer open questions in general terms (no day, time or
    promise the caller didn't offer) or move the call on. text is a short instruction to the
    agent, which speaks as {owner_name}: call {owner_name} "you", never "me" or by name; label is
    2–4 words. In the waste time stage, ways to keep the scammer busy instead, e.g. label "Can't
    find card", text "Say you can't find your card and ask them to hold on." Not whether the
    call is genuine or a scam (there are buttons for that). Keep the current buttons, if given,
    unless they no longer fit (e.g. the stage changed). Empty if nothing fits.
    alert: true only if {owner_name} may want to act while the caller is still on the line
    (someone at the door, an urgent call back); never for a scam or spam.
# After hangup, a running Luna call may finish (so the summary sees it) for up to this long.
drain_timeout_ms: 60000
