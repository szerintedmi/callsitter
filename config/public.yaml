# The public "Scam me" page on the public host (src/web/public.ts). Its call limits (anyone with
# the link can call) are in limits.yaml.
enabled: true            # false: the page says it's closed
notify_per_ip_per_day: 5 # email sign-ups per client IP over a rolling 24 h, each form ("notify me", the /bot waitlist) its own (in memory)
tools: true             # Luna may message the owner and end the call; false: her tools run dry
greeting_wait_ms: 3000   # Live greets once the page's audio is connected, or after this long
